[project]
name = "phaseforge"
version = "0.1.0"
description = "Phase-Bootstrapped Mixture-of-Experts for Long-Horizon Robotic Manipulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "h5py>=3.10",
    "numpy>=1.26",
    "wandb>=0.16",
    "tqdm>=4.66",
    "rich>=13.7",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",  # mannwhitneyu for multi-seed head-to-head comparisons (D3)
    "filelock>=3.12",  # cross-process lock for the append-only results ledger
    "packaging>=23.0",  # version parsing in the environment parity gate
    # Used only by the optional dataset archival/upload utility.
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
# Simulator pin for the state-only rollout protocol (docs/plan/
# state_only_rollout_implementation_plan.md §4.1): the robomimic v0.4 v1.5
# track (amandlek/robomimic v1.5/lift/ph/low_dim_v15.hdf5) was collected
# with the robosuite v1.5.1 branch, whose PyPI metadata requires
# mujoco>=3.2.3; 3.2.7 is the newest 3.2.x. The runtime parity gate
# re-verifies the installed versions against the dataset's recorded
# env_args and fails closed on any mismatch.
# Install only on the evaluation machine: uv sync --extra rollout.
rollout = [
    "robosuite==1.5.1",
    "mujoco==3.2.7",
]

[project.scripts]
phaseforge-train          = "phaseforge.cli:train"
phaseforge-eval           = "phaseforge.cli:evaluate"
phaseforge-sweep          = "phaseforge.runner.cli:main"
phaseforge-gates          = "phaseforge.evaluations.rollout.gates_cli:gates"
phaseforge-rollout-report = "phaseforge.evaluations.rollout.report_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
