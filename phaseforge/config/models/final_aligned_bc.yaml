# config/models/final_aligned_bc.yaml — Final-aligned normalized BC (Stage 1 provider).
#
# The Stage 1 representation provider for the plain-encoder and factorial
# rows: dense behavior cloning with the final-family
# NORMALIZED encoder contract (normalize_output=true). This dedicated
# provider config exists so plain/factorial prototypes are computed in the same
# normalized latent geometry the final family routes in.
# Stage 1 only: no router, no experts, no phase head.

name: "final_aligned_bc"
_target_: phaseforge.models.baselines.bc.BehaviorCloningModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true
  normalize_output: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256
