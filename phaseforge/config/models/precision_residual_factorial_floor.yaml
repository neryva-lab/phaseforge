# config/models/precision_residual_factorial_floor.yaml — Final two-factor corner (MODEL-05).
#
# Plain normalized BC representation (no SupCon, no phase head) PLUS random
# prototype-router initialization, with the canonical 50% partial
# warm-start. This is intentionally a 2x2 factorial corner
# (representation x router-init), NOT a single-factor ablation, and must be
# reported as such. Metadata declares both factors.

name: "precision_residual_factorial_floor"
_target_: phaseforge.models.baselines.precision_residual_plain_encoder.PrecisionResidualPlainEncoderModel

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true
  normalize_output: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

router:
  _target_: phaseforge.models.components.prototype_router.PrototypeRouter
  latent_dim: 128
  num_experts: 6
  top_k: 1
  margin: 0.5
  balance_coeff: 0.0001

expert:
  _target_: phaseforge.models.components.impedance_expert.ResidualImpedanceExpert
  input_dim: 128
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  action_scale: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5, 0.04]
  kappa_min: 0.1
  kappa_max: 5.0
  beta: 0.0

freeze_encoder: false
encoder_lr_scale: 0.1

num_phases: 6

router_init:
  type: "random"

bootstrap_label_field: "phase_topo"

expert_init:
  type: "partial_warm"
  drop_rate: 0.5
  jitter_std: 0.0
  seed: ${project.seed}
