# config/models/final_aligned_static_rule.yaml — Final rule-label comparison (MODEL-07).
#
# Same final family as precision_residual_phaseforge EXCEPT the label
# vocabulary: human/rule-derived `phase` consistently for Stage 1 phase CE,
# SupCon, prototype initialization, and the Stage 2 margin loss — never
# phase_topo. Trains from its OWN rule-label Stage 1 provider
# (final_aligned_static_rule_stage1), never the topology checkpoint. This is
# an INTEGRATED representation-plus-initialization label-source comparison,
# not a router-only ablation.

name: "final_aligned_static_rule"
_target_: phaseforge.models.phase_moe.PhaseBootstrappedMoE

encoder:
  _target_: phaseforge.models.components.encoder.StateEncoder
  input_dim: ${data.state_dim}
  hidden_dims: [256, 256, 256]
  latent_dim: 128
  activation: "gelu"
  dropout: 0.1
  use_residual: true
  normalize_output: true

action_head:
  _target_: phaseforge.models.components.action_head.ActionHead
  input_dim: 128
  output_dim: ${data.action_dim}
  head_type: "deterministic"
  hidden_dim: 256

phase_head:
  _target_: phaseforge.models.components.phase_head.PhaseClassificationHead
  latent_dim: 128
  num_phases: 6

router:
  _target_: phaseforge.models.components.prototype_router.PrototypeRouter
  latent_dim: 128
  num_experts: 6
  top_k: 1
  margin: 0.5
  balance_coeff: 0.0001

expert:
  _target_: phaseforge.models.components.impedance_expert.ResidualImpedanceExpert
  input_dim: 128
  hidden_dims: [256]
  output_dim: ${data.action_dim}
  action_scale: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5, 0.04]
  kappa_min: 0.1
  kappa_max: 5.0
  beta: 0.0

freeze_encoder: false
encoder_lr_scale: 0.1

soft_mapping:
  enabled: false

teacher_routing:
  enabled: false

router_init:
  type: "centroid"
  prototype_source: "rule"
  mapping_mode: "prototype_softmax"
  temperature: 1.0
  seed: ${project.seed}

expert_init:
  type: "partial_warm"
  drop_rate: 0.5
  seed: ${project.seed}
  jitter_std: 0.0
