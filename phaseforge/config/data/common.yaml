# Shared data parameters for the non-visual robomimic/robosuite protocol.
#
# DEPRECATED: this file is the legacy Lift config. The canonical Lift
# config is now ``phaseforge/config/data/lift.yaml`` (identical content).
# The five-task evaluation uses one of: ``lift``, ``can``, ``square``,
# ``tool_hang``, ``transport``. ``common`` is accepted as a synonym for
# ``lift`` to preserve backward compatibility with the original single-task
# pilot; new code should reference the per-task YAML by name.

batch_size: 256
num_workers: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2

# The current model/trainer path is single-step. History support is a required
# follow-up before making a history-dependent claim.
sequence_length: 1
stride: 1

normalization_strategy: "zscore"

# Primary single-task pilot schema: privileged structured low-dimensional state.
# It is intentionally not RGB and not bare robot proprioception.
state_keys:
  - key: "robot0_eef_pos"
    dim: 3
  - key: "robot0_eef_quat"
    dim: 4
  - key: "robot0_gripper_qpos"
    dim: 2
  - key: "object"
    dim: 10

action_key: "actions"
action_dim: 7
state_dim: 19
schema_version: "robomimic-lift-structured-v1"
action_contract:
  # The HDF5 file stores the environment action vector. The exact controller
  # interpretation (for example delta versus absolute pose) must be read from
  # env_args and pinned in the rollout adapter before evaluation. Per the
  # robomimic dataset convention, stored actions are normalized to [-1, 1]
  # (robomimic's get_dataset_info.py enforces this on every released
  # artifact); the ingester re-verifies the same bound on ingest.
  representation: "robosuite_environment_action"
  range: [-1.0, 1.0]
  gripper_convention: "robosuite_action_convention"
  requires_env_metadata: true

source:
  name: "robomimic"
  task_name: "Lift"
  dataset_type: "ph"
  hdf5_type: "low_dim"
  expected_env_name: "Lift"
  # Override PHASEFORGE_DATA_DIR or data.source.dir on each machine. Raw data
  # must remain outside the repository and must not be downloaded by training.
  dir: "${oc.env:PHASEFORGE_DATA_DIR,data}/raw/robomimic/lift"
  manifest_path: null
  # Fail-closed by default: VALIDATE_SOURCE raises when the raw directory is
  # missing. Setting this to true routes the FSM through PROVISION_SOURCE,
  # which downloads the artifact below (SHA-256-verified, idempotent) before
  # ingestion — use it explicitly (e.g. the notebook data-prep cell), never
  # as a silent training-time download.
  auto_download: false
  huggingface:
    # Official robomimic v0.1 (v1.5 track) Proficient-Human low-dim dataset.
    repo_id: "amandlek/robomimic"
    path: "v1.5/lift/ph/low_dim_v15.hdf5"
    # Pin the artifact checksum when known; otherwise the mirror's own LFS
    # metadata is used for verification.
    sha256: null

phase_labeler:
  _target_: phaseforge.data.robomimic.phase_labeler.RuleBasedPhaseLabeler
  num_phases: 6
  # Closed/open gripper levels are calibrated per demonstration from the
  # observed aperture range (sign- and scale-agnostic); these absolute
  # thresholds are only fallbacks for degenerate (nearly constant) demos.
  gripper_closed_threshold: 0.02
  gripper_open_threshold: 0.04
  eef_velocity_threshold: 0.01
  min_phase_duration: 5
  median_filter_size: 7
  eef_pos_slice: [0, 3]
  gripper_qpos_slice: [7, 9]

ingester:
  _target_: phaseforge.data.robomimic.ingester.RobomimicHDF5Ingester
  state_keys: ${data.state_keys}
  action_key: ${data.action_key}
  action_dim: ${data.action_dim}
  action_range: ${data.action_contract.range}
  expected_env_name: ${data.source.expected_env_name}
  respect_dataset_filters: ${data.split.use_dataset_filters}
  phase_labeler: ${data.phase_labeler}

# One policy per task is the primary protocol. Within-task trajectory splits
# keep validation available for the single-task pilot without task leakage.
split:
  strategy: "trajectory"
  use_dataset_filters: true
  val_ratio: 0.1
  seed: 42

# Cache reuse is fail-closed: a different schema/source/split may not be used.
enforce_strict_cache: true

# Corruption ablation overrides (default: no corruption).
# phase_corruption_rate: fraction of phase labels uniformly re-assigned at
#   random in Stage 1 training. 0.0 = no corruption, 1.0 = all labels random.
# phase_shuffle_control: when true AND phase_corruption_rate=1.0, applies a
#   permutation (bijective relabelling) instead of uniform random noise,
#   preserving marginal phase counts.
phase_corruption_rate: 0.0
phase_shuffle_control: false

# Cache root (resolved under the shared data root by the cache manager).
cache_root: "cache"
